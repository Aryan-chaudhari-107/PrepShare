</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Experiences from university-hosted hackathons.</p>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="off-campus-hackathon">

<style>
        /* Custom toggle styles */
        input:checked ~ .block {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }
        input:checked ~ .dot {
            transform: translateX(100%);
        }
        input:checked ~ .dot #offer-check-icon {
            opacity: 1;
            color: theme('colors.primary');
        }
    </style>
<script>
        // Simple script to toggle college field visibility based on category
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="category"]');
            const collegeFieldContainer = document.getElementById('college-field-container');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value.includes('campus')) {
                        collegeFieldContainer.style.display = 'flex';
                    } else {
                        collegeFieldContainer.style.display = 'none';
                    }
                });
            });
        });
    </script>


<button class="fixed bottom-8 right-8 w-14 h-14 bg-primary text-on-primary rounded-full shadow-xl flex items-center justify-center hover:bg-primary-fixed-dim transition-all active:scale-95 z-50 group">
